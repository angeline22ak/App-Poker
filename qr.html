<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR da Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1512; --ink: #eef5f1; --gold: #e8c15a; --gold-deep: #c3952f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink);
    background:
      radial-gradient(130% 90% at 50% -10%, #132a20 0%, rgba(19,42,32,0) 60%),
      radial-gradient(120% 70% at 50% 115%, #10231a 0%, rgba(16,35,26,0) 55%),
      var(--bg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .sheet {
    background: #fffdf7; color: #17211b; border-radius: 22px; padding: 34px 30px;
    border: 1px solid rgba(232,193,90,.5);
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    text-align: center; max-width: 420px; width: 100%;
  }
  .sheet h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 30px; font-weight: 800; margin: 0 0 2px; letter-spacing: .01em;
  }
  .sheet h1 .s { color: var(--gold-deep); }
  .suits { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 10px; font-size: 14px; color: #1a241e; }
  .suits .r { color: #c2443a; }
  .suits::before, .suits::after { content: ""; width: 54px; height: 1px; background: linear-gradient(90deg, transparent, rgba(195,149,47,.75)); }
  .suits::after { background: linear-gradient(90deg, rgba(195,149,47,.75), transparent); }
  .sheet .sub { color: #555; font-size: 15px; margin: 0 0 20px; }
  .qr-frame {
    display: inline-block; padding: 14px; border-radius: 18px; margin: 0 auto 16px;
    border: 2px solid var(--gold-deep); background: #fff;
  }
  #qr { display: flex; justify-content: center; }
  #qr img, #qr canvas { width: 240px !important; height: 240px !important; }
  .url { font-size: 13px; color: #777; word-break: break-all; margin: 0; }
  .perks { margin: 18px 0 0; padding-left: 4px; font-size: 14px; color: #333; text-align: left; list-style: none; }
  .perks li { margin: 7px 0; display: flex; align-items: center; gap: 9px; }
  .perks svg { width: 16px; height: 16px; flex: none; color: var(--gold-deep); }
  .actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 18px; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  .btn-gold { background: linear-gradient(180deg, #f4d98c, var(--gold) 55%, var(--gold-deep)); color: #201705; box-shadow: 0 4px 14px rgba(232,193,90,.35); }
  .btn-ghost { background: #eee; color: #333; }
  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; max-width: none; border: none; }
    .actions { display: none; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <h1><span class="s">♠</span> Mesa Poker</h1>
    <div class="suits" aria-hidden="true"><span>♠</span><span class="r">♥</span><span>♣</span><span class="r">♦</span></div>
    <p class="sub">Aponte a câmera do celular e acompanhe a mesa ao vivo</p>
    <div class="qr-frame"><div id="qr"></div></div>
    <p class="url" id="url-label"></p>
    <ul class="perks">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>Sua conta na mesa em tempo real</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h12M4 9h10M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.8a2 2 0 0 0-.6-1.4L18 5"/></svg>Bônus gasolina e bônus comida por tempo de jogo</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M6 9l6 6 6-6"/><path d="M19 21H5"/></svg>Instale como app na tela inicial</li>
    </ul>
    <div class="actions">
      <button class="btn btn-gold" onclick="window.print()">Imprimir</button>
      <button class="btn btn-ghost" onclick="location.href='./'">Voltar ao app</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    var target = location.origin + '/';
    document.getElementById('url-label').textContent = target;
    new QRCode(document.getElementById('qr'), {
      text: target, width: 240, height: 240,
      colorDark: '#0b1512', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
